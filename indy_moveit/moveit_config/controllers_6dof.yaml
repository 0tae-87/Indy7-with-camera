controller_names:
    - joint_trajectory_controller
    - gripper_controller


joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
        - joint0
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5

gripper_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
        - left_finger_joint
        - right_finger_joint
